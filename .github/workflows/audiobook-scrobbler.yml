name: audiobook-scrobbler

on:
  push:
    paths:
      - 'projects/audiobook-scrobbler/**'
      - '.github/workflows/audiobook-scrobbler.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/audiobook-scrobbler/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/audiobook-scrobbler/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
