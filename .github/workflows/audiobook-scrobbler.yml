name: audiobook-scrobbler

on:
  push:
    paths:
      - 'projects/audiobook-scrobbler/**'
      - '.github/workflows/audiobook-scrobbler.yml'
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/audiobook-scrobbler/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/audiobook-scrobbler/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/audiobook-scrobbler/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: audio-scrobbler-debug-apk
          path: projects/audiobook-scrobbler/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
